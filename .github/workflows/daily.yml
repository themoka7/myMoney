name: daily-top10

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 평일 16:40 KST (장 마감 후 KRX 데이터 확정 이후)
  workflow_dispatch:
    inputs:
      date:
        description: "수집일 YYYYMMDD (비우면 가장 최근 영업일)"
        required: false
      force:
        description: "이미 수집된 날짜도 덮어쓰기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-top10
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q

      - name: 수집 → 점수 → 저장
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m mymoney run $ARGS

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(ls data/top10 | sort | tail -1 | cut -d. -f1) TOP10"
          git push

      - name: Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="--date $INPUT_DATE"; fi
          DATE=$(python -m mymoney notes $ARGS --out notes.md)
          TAG="daily-$DATE"
          TITLE="📊 ${DATE:0:4}-${DATE:4:2}-${DATE:6:2} TOP10"
          ASSET="top10-$DATE.json"
          cp "data/top10/$DATE.json" "$ASSET"
          LATEST=$(ls data/top10/*.json | sort | tail -1 | xargs basename | cut -d. -f1)
          if [ "$DATE" = "$LATEST" ]; then LATEST_FLAG="--latest"; else LATEST_FLAG="--latest=false"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md $LATEST_FLAG
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target main --title "$TITLE" --notes-file notes.md $LATEST_FLAG
          fi
