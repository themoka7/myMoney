name: daily-top10

on:
  schedule:
    # GitHub 예약 실행은 부하가 크면 늦어지거나 아예 빠질 수 있다 → 같은 날 여러 번 걸어 둔다.
    # 이미 수집된 날은 건너뛰고 Release만 갱신하므로 여러 번 돌아도 안전하다.
    - cron: "40 7 * * 1-5"    # 16:40 KST
    - cron: "17 9 * * 1-5"    # 18:17 KST (백업)
    - cron: "47 11 * * 1-5"   # 20:47 KST (백업)
    - cron: "23 23 * * 0-4"   # 다음날 08:23 KST (최후 백업 — 전날 빠진 걸 채움)
  workflow_dispatch:
    inputs:
      date:
        description: "수집일 YYYYMMDD (비우면 데이터가 확정된 가장 최근 영업일)"
        required: false
      force:
        description: "이미 수집된 날짜도 덮어쓰기"
        type: boolean
        default: false
      backfill_days:
        description: "최근 N영업일 백필 (0이면 하루만). 날짜를 넣으면 그날까지 N일"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-top10
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - run: python -m pytest -q

      - name: 수집 → 점수 → 저장
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TZ: Asia/Seoul
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_BACKFILL: ${{ inputs.backfill_days }}
        run: |
          ARGS=""
          if [ "$INPUT_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "$INPUT_BACKFILL" ] && [ "$INPUT_BACKFILL" != "0" ]; then
            if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --end $INPUT_DATE"; fi
            python -m mymoney backfill --days "$INPUT_BACKFILL" $ARGS
          else
            if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
            python -m mymoney run $ARGS
          fi

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "data: $(ls data/top10 | sort | tail -1 | cut -d. -f1) TOP10"
          git push

      - name: Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_BACKFILL: ${{ inputs.backfill_days }}
        run: |
          ALL=$(ls data/top10/*.json | sort | xargs -n1 basename | cut -d. -f1)
          if [ -n "$INPUT_BACKFILL" ] && [ "$INPUT_BACKFILL" != "0" ]; then
            # 백필이면 순위변화·추적이 새로 생긴 기존 날짜까지 전부 갱신
            DATES=$ALL
          elif [ -n "$INPUT_DATE" ]; then
            DATES=$INPUT_DATE
          else
            DATES=$(echo "$ALL" | tail -1)
          fi
          scripts/release.sh $DATES
